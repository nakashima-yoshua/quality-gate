name: Unit tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic tests
        run: |
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          PYTHONPATH=src python3 -m compileall -q src
